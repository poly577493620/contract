[project]
name = "smart-compliance-assistant"
version = "0.1.0"
description = "智审合规助手：采购结果与采购合同智能质检原型"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "httpx>=0.27.0",
    "onnxruntime>=1.29.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pymupdf>=1.24.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "rapidocr>=3.9.2",
    "reportlab>=4.2.0",
    "streamlit>=1.40.0",
    "structlog>=24.4.0",
]

[project.scripts]
smart-compliance = "smart_compliance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_compliance"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".pytest_tmp/**", ".venv/**", "data/**", "outputs/**", "tmp/**"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "G",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "RUF",
]
ignore = ["PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["smart_compliance"]

[[tool.mypy.overrides]]
module = ["pymupdf", "rapidocr", "reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["smart_compliance.parsing.ocr_parser", "smart_compliance.parsing.pdf_parser"]
disable_error_code = ["no-untyped-call"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest_tmp"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires explicit external services or credentials",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "types-reportlab>=4.2.0",
]
